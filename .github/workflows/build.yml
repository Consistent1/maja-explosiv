# Reusable build. Downstream deploy workflows call this, so the build lives in
# exactly one place and every deploy target gets identical bytes.
#
#   jobs:
#     build:
#       uses: ./.github/workflows/build.yml
#       with:
#         path-prefix: /my-repo-name/
name: Build

on:
  workflow_call:
    inputs:
      path-prefix:
        description: 'Value for ELEVENTY_PATH_PREFIX. Use "/<repo>/" for project Pages, "/" for a custom domain or a server root.'
        required: false
        default: '/'
        type: string
      node-version:
        required: false
        default: '22'
        type: string
      artifact-name:
        required: false
        default: 'site'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          # Dependency caching -- OFF by default so this workflow runs unchanged
          # in BOTH lockfile configurations. `cache: npm` hard-fails with
          # "Dependencies lock file is not found" when package-lock.json is
          # absent, and it fails HERE, before the install step below gets its
          # chance to fall back. Uncomment it only if the lockfile is committed
          # (it is, by default -- see .gitignore). Saves ~15-20s per run.
          # cache: npm

      # Both lockfile configurations are supported. `npm ci` is the reproducible
      # install and needs a committed package-lock.json; `npm install` is the
      # fallback when the lockfile is gitignored. See README -> "A note on the
      # lockfile" for how to switch.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        env:
          ELEVENTY_PATH_PREFIX: ${{ inputs.path-prefix }}
        run: npx eleventy

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: _site
          retention-days: 7
