# Deploy to GitHub Pages.
#
# ENABLED for this site: runs on every push to main, and on demand.
#
# ONE MANUAL STEP IS REQUIRED BEFORE THE FIRST RUN:
#   Settings -> Pages -> Build and deployment -> Source: **GitHub Actions**
# This repo is currently set to "Deploy from a branch: main /docs". Until the
# source is switched, this workflow builds fine and then FAILS at the deploy
# step. Switch it, then delete the tracked docs/ directory -- not before, or
# the live site goes down in the gap.
#
# This replaces the older "build into docs/ and commit it" flow. Nothing built
# is committed, so image bytes are not duplicated in git history on every deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # For a PROJECT site (https://<user>.github.io/<repo>/) path-prefix must be
    # "/<repo>/". For a USER site or a custom domain, use "/".
    uses: ./.github/workflows/build.yml
    with:
      path-prefix: /maja-explosiv/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
