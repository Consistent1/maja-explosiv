# Deploy to GitHub Pages.
#
# ENABLED for this site: runs on every push to main, and on demand.
#
# SETUP IS COMPLETE (2026-08-27): Settings -> Pages -> Source is "GitHub
# Actions", and docs/ is gitignored and untracked. Pushing to main IS the
# deploy. If the deploy step ever fails with a Pages error, check that setting
# first -- reverting it silently breaks this workflow at the last step.
#
# This replaced the older "build into docs/ and commit it" flow. Nothing built
# is committed, so image bytes are not duplicated in git history on every deploy.
# That route is retired, NOT removed: build:github / copy:docs / deploy:github
# are still in package.json. See README -> "3. Going back to the `docs/` route".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # For a PROJECT site (https://<user>.github.io/<repo>/) path-prefix must be
    # "/<repo>/". For a USER site or a custom domain, use "/".
    uses: ./.github/workflows/build.yml
    with:
      path-prefix: /maja-explosiv/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
